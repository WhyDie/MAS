version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: military_db
    restart: always
    environment:
      POSTGRES_USER: military_admin
      POSTGRES_PASSWORD: secure_military_password
      POSTGRES_DB: military_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: military_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: